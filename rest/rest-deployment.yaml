apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
    spec:
      containers:
        - name: rest
          image: YOUR_DOCKER_USERNAME_HERE/demucs-rest:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: MINIO_ENDPOINT, value: minio:9000 }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: username
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: password
            - { name: QUEUE_BUCKET, value: queue }
            - { name: OUTPUT_BUCKET, value: output }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
